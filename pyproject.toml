[project]
name = "reactionjson"
version = "0.1.0"
description = "Atomic graph edits for retrosynthesis: apply an op sequence to a molecule, or derive the ops from a mapped reaction."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "rdkit>=2023.9.1",
    "numpy",
    "networkx>=2.4",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reactionjson"]
